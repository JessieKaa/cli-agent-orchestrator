[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cao-ilink-webhook"
version = "0.1.0"
description = "WeChat iLink webhook plugin for CLI Agent Orchestrator"
requires-python = ">=3.10"
dependencies = [
    "cli-agent-orchestrator",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.entry-points."cao.plugins"]
ilink_webhook = "cao_ilink_webhook.plugin:ILinkWebhookPlugin"
